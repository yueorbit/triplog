<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TripLog — your journey, in time and place." />

  <title>TripLog</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <!-- TripLog stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- MapLibre stylesheet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
  />
</head>

<body>

  <!-- =========================
       TOP NAVIGATION
  ========================== -->

  <header class="topbar">

    <a class="brand" href="#">
      TripLog
    </a>

    <div class="topbar-actions">

      <button
        class="ghost-btn"
        id="editTripBtn"
      >
        Edit trip
      </button>

      <button
        class="primary-btn"
        id="newTripBtn"
      >
        New trip
      </button>

    </div>

  </header>


  <!-- =========================
       MAIN CONTENT
  ========================== -->

  <main>

    <!-- HERO -->

    <section class="hero">

      <div>

        <p class="eyebrow">
          TRAVEL MEMORY
        </p>

        <h1 id="tripTitle">
          Thailand
        </h1>

        <p
          class="hero-subtitle"
          id="tripMeta"
        >
          12 days · 3 cities
        </p>

      </div>


      <div class="hero-stat">

        <span id="totalSpend">
          ¥0
        </span>

        <small>
          Total spend
        </small>

      </div>

    </section>


    <!-- =========================
         MAIN WORKSPACE
    ========================== -->

    <section class="workspace">


      <!-- =========================
           TIMELINE
      ========================== -->

      <aside class="timeline-panel">

        <div class="section-head">

          <div>

            <span class="section-kicker">
              TIMELINE
            </span>

            <h2>
              Your journey
            </h2>

          </div>


          <button
            class="icon-btn"
            id="addMomentBtn"
            title="Add moment"
          >
            +
          </button>

        </div>


        <div
          id="timeline"
          class="timeline"
        ></div>


        <button
          class="add-entry-btn"
          id="addMomentBottom"
        >
          + Add moment
        </button>

      </aside>


      <!-- =========================
           MAP
      ========================== -->

      <section class="map-panel">

        <div id="map"></div>


        <div class="map-overlay">

          <div class="map-search-wrap">

            <input
              id="placeSearch"
              type="search"
              placeholder="Search a place or address..."
              autocomplete="off"
            />

            <button id="searchPlaceBtn">
              Search
            </button>

          </div>


          <div
            id="searchResults"
            class="search-results hidden"
          ></div>

        </div>


        <div class="map-note">
          OpenStreetMap data · MapLibre
        </div>

      </section>

    </section>

  </main>


  <!-- =========================
       TRIP MODAL
  ========================== -->

  <div
    class="modal hidden"
    id="tripModal"
  >

    <div class="modal-card">

      <button
        class="modal-close"
        data-close="tripModal"
      >
        ×
      </button>


      <p class="section-kicker">
        TRIP
      </p>


      <h2 id="tripModalTitle">
        New trip
      </h2>


      <form id="tripForm">

        <label>

          Trip name

          <input
            id="tripName"
            required
          />

        </label>


        <div class="two-col">

          <label>

            Start date

            <input
              id="tripStart"
              type="date"
              required
            />

          </label>


          <label>

            End date

            <input
              id="tripEnd"
              type="date"
              required
            />

          </label>

        </div>


        <button
          class="primary-btn wide"
          type="submit"
        >
          Save trip
        </button>

      </form>

    </div>

  </div>


  <!-- =========================
       MOMENT MODAL
  ========================== -->

  <div
    class="modal hidden"
    id="momentModal"
  >

    <div class="modal-card large">

      <button
        class="modal-close"
        data-close="momentModal"
      >
        ×
      </button>


      <p class="section-kicker">
        MOMENT
      </p>


      <h2 id="momentModalTitle">
        Add moment
      </h2>


      <form id="momentForm">


        <!-- DATE + TIME -->

        <div class="two-col">

          <label>

            Date

            <input
              id="momentDate"
              type="date"
              required
            />

          </label>


          <label>

            Time

            <input
              id="momentTime"
              type="time"
            />

          </label>

        </div>


        <!-- TITLE -->

        <label>

          Title

          <input
            id="momentTitle"
            placeholder="e.g. Morning in the old city"
            required
          />

        </label>


        <!-- PLACE -->

        <label>

          Place

          <div class="place-field">

            <input
              id="momentPlace"
              placeholder="Search a place..."
              autocomplete="off"
            />

            <button
              type="button"
              id="momentPlaceSearch"
            >
              Find
            </button>

          </div>

        </label>


        <div
          id="momentSearchResults"
          class="inline-results hidden"
        ></div>


        <!-- REAL LOCATION DATA -->

        <input
          id="momentLat"
          type="hidden"
        />

        <input
          id="momentLng"
          type="hidden"
        />

        <input
          id="momentAddress"
          type="hidden"
        />


        <!-- THOUGHTS -->

        <label>

          Thoughts

          <textarea
            id="momentThoughts"
            rows="4"
            placeholder="A note, a feeling, a tiny memory..."
          ></textarea>

        </label>


        <!-- EXPENSE -->

        <div class="two-col">

          <label>

            Expense

            <input
              id="momentExpense"
              type="number"
              min="0"
              step="0.01"
              placeholder="0"
            />

          </label>


          <label>

            Currency

            <select id="momentCurrency">

              <option>
                CNY
              </option>

              <option>
                THB
              </option>

              <option>
                USD
              </option>

            </select>

          </label>

        </div>


        <!-- PHOTO -->

        <label>

          Photo

          <input
            id="momentPhoto"
            type="file"
            accept="image/*"
          />

        </label>


        <div
          id="photoPreview"
          class="photo-preview"
        ></div>


        <!-- FORM ACTIONS -->

        <div class="form-actions">

          <button
            type="button"
            class="danger-btn hidden"
            id="deleteMomentBtn"
          >
            Delete
          </button>


          <span></span>


          <button
            type="button"
            class="ghost-btn"
            data-close="momentModal"
          >
            Cancel
          </button>


          <button
            class="primary-btn"
            type="submit"
          >
            Save moment
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <!-- MapLibre -->
  <script
    src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"
  ></script>


  <!-- TripLog application -->
  <script
    type="module"
    src="app.js"
  ></script>

</body>
</html>
